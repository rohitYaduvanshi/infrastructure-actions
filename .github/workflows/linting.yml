name: Linting and MyPy (Pelican)

on:
  push:
    paths:
      - '**.py'
      - '**/linting.yml'
      - '**/pylintrc'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --no-deps
          pip install mypy types-PyYAML types-requests types-beautifulsoup4 types-markdown pylint

      - name: Type testing with mypy
        run: |
          mypy --cache-dir /tmp/ --install-types --non-interactive pelican
          mypy --cache-dir /tmp/ pelican

      - name: Code linting with pylint
        run: |
          pylint pelican/**/*.py
